services:
  webmgr:
    build:
      context: .
      dockerfile: Dockerfile.webmgr
    image: metatube-webmgr:local
    container_name: metatube-webmgr
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8081
      - APP_DATA_DIR=/app/data
      - METATUBE_API_HOST=0.0.0.0
      - METATUBE_API_PORT=8080
      - METATUBE_MOVIE_PROVIDER=JavBus
      - METATUBE_TOKEN=
      - MT_MOVIE_PROVIDER_PROXY=
      - MT_PROVIDER_PROXY=
      - HTTP_PROXY=
      - HTTPS_PROXY=
    volumes:
      - webmgr-data:/app/data

volumes:
  webmgr-data:
